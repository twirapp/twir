extend type Query {
	quotes: [Quote!]! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: VIEW_QUOTES)
	quotesPublic(channelId: String!): [Quote!]!
}

extend type Mutation {
	quoteCreate(opts: QuoteCreateInput!): Quote! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_QUOTES)
	quoteUpdate(id: UUID!, opts: QuoteUpdateInput!): Quote! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_QUOTES)
	quoteRemove(id: UUID!): Boolean! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_QUOTES)
}

type Quote {
	id: UUID!
	number: Int!
	text: String!
	creatorId: String
	creatorName: String
	gameId: String
	gameName: String
	createdAt: Time!
	updatedAt: Time!
}

input QuoteCreateInput {
	text: String! @validate(constraint: "min=1,max=5000")
}

input QuoteUpdateInput {
	text: String @validate(constraint: "min=1,max=5000")
}
