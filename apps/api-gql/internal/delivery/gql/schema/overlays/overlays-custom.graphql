extend type Query {
  channelOverlays: [ChannelOverlay!]!
    @isAuthenticated
    @hasAccessToSelectedDashboard
    @hasChannelRolesDashboardPermission(permission: VIEW_OVERLAYS)
  channelOverlayById(id: UUID!): ChannelOverlay
    @isAuthenticated
    @hasAccessToSelectedDashboard
    @hasChannelRolesDashboardPermission(permission: VIEW_OVERLAYS)
}

extend type Mutation {
  channelOverlayCreate(input: ChannelOverlayCreateInput!): ChannelOverlay!
    @isAuthenticated
    @hasAccessToSelectedDashboard
    @hasChannelRolesDashboardPermission(permission: MANAGE_OVERLAYS)
  channelOverlayUpdate(
    id: UUID!
    input: ChannelOverlayUpdateInput!
  ): ChannelOverlay!
    @isAuthenticated
    @hasAccessToSelectedDashboard
    @hasChannelRolesDashboardPermission(permission: MANAGE_OVERLAYS)
  channelOverlayDelete(id: UUID!): Boolean!
    @isAuthenticated
    @hasAccessToSelectedDashboard
    @hasChannelRolesDashboardPermission(permission: MANAGE_OVERLAYS)
  channelOverlayParseHtml(html: String!): String!
    @isAuthenticated
    @hasAccessToSelectedDashboard
    @hasChannelRolesDashboardPermission(permission: MANAGE_OVERLAYS)
}

extend type Subscription {
  customOverlaySettings(id: UUID!, apiKey: String!): ChannelOverlay!
}

enum ChannelOverlayLayerType {
  HTML
  IMAGE
  TEXT
  VIDEO
  IFRAME
  YOUTUBE
  EMOTE
}

type ChannelOverlayLayerSettings {
  htmlOverlayHtml: String!
  htmlOverlayCss: String!
  htmlOverlayJs: String!
  htmlOverlayDataPollSecondsInterval: Int!
  imageUrl: String!
  textContent: String!
  textFontFamily: String!
  textFontSize: Int!
  textFontWeight: Int!
  textColor: String!
  textAlign: String!
  videoUrl: String!
  videoLoop: Boolean!
  videoMuted: Boolean!
  iframeUrl: String!
  iframeScale: Float!
  widgetKey: String!
  youtubeVideoId: String!
  youtubeAutoplay: Boolean!
  youtubeLoop: Boolean!
  youtubeMuted: Boolean!
  emoteUrl: String!
  emoteName: String!
  emoteProvider: String!
}

type ChannelOverlayLayer {
  id: UUID!
  type: ChannelOverlayLayerType!
  settings: ChannelOverlayLayerSettings!
  overlayId: UUID!
  posX: Int!
  posY: Int!
  width: Int!
  height: Int!
  rotation: Int!
  createdAt: Time!
  updatedAt: Time!
  periodicallyRefetchData: Boolean!
  locked: Boolean!
  visible: Boolean!
  opacity: Float!
}

type ChannelOverlay {
  id: UUID!
  channelId: String!
  name: String!
  createdAt: Time!
  updatedAt: Time!
  width: Int!
  height: Int!
  layers: [ChannelOverlayLayer!]!
  instaSave: Boolean!
}

input ChannelOverlayLayerSettingsInput {
  htmlOverlayHtml: String!
  htmlOverlayCss: String!
  htmlOverlayJs: String!
  htmlOverlayDataPollSecondsInterval: Int!
    @validate(constraint: "min=5,max=600")
  imageUrl: String!
  textContent: String!
  textFontFamily: String!
  textFontSize: Int!
  textFontWeight: Int!
  textColor: String!
  textAlign: String!
  videoUrl: String!
  videoLoop: Boolean!
  videoMuted: Boolean!
  iframeUrl: String!
  iframeScale: Float!
  widgetKey: String!
  youtubeVideoId: String!
  youtubeAutoplay: Boolean!
  youtubeLoop: Boolean!
  youtubeMuted: Boolean!
  emoteUrl: String!
  emoteName: String!
  emoteProvider: String!
}

input ChannelOverlayLayerInput {
  id: UUID
  type: ChannelOverlayLayerType!
  settings: ChannelOverlayLayerSettingsInput!
  posX: Int!
  posY: Int!
  width: Int!
  height: Int!
  rotation: Int!
  periodicallyRefetchData: Boolean!
  locked: Boolean!
  visible: Boolean!
  opacity: Float!
}

input ChannelOverlayCreateInput {
  name: String! @validate(constraint: "max=30")
  width: Int! @validate(constraint: "min=1")
  height: Int! @validate(constraint: "min=1")
  layers: [ChannelOverlayLayerInput!]! @validate(constraint: "max=15,dive")
  instaSave: Boolean!
}

input ChannelOverlayUpdateInput {
  name: String! @validate(constraint: "max=30")
  width: Int! @validate(constraint: "min=1")
  height: Int! @validate(constraint: "min=1")
  layers: [ChannelOverlayLayerInput!]! @validate(constraint: "max=15,dive")
  instaSave: Boolean!
}
