extend type Query {
	streamelementsGetAuthorizationUrl: String! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_INTEGRATIONS)
	streamelementsGetData: StreamElementsIntegration @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: VIEW_INTEGRATIONS)
	nightbotGetAuthLink: String! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_INTEGRATIONS)
	nightbotGetData: NightbotIntegration @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: VIEW_INTEGRATIONS)
}

extend type Mutation {
	nightbotPostCode(input: IntegrationOAuthCodeInput!): Boolean! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_INTEGRATIONS)
	nightbotLogout: Boolean! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_INTEGRATIONS)
	nightbotImportCommands: ImportReport! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_COMMANDS)
	nightbotImportTimers: ImportReport! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_TIMERS)
	streamelementsPostCode(input: IntegrationOAuthCodeInput!): Boolean! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_INTEGRATIONS)
	streamelementsLogout: Boolean! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_INTEGRATIONS)
	streamelementsImportCommands: ImportReport! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_COMMANDS)
	streamelementsImportTimers: ImportReport! @isAuthenticated @hasAccessToSelectedDashboard @hasChannelRolesDashboardPermission(permission: MANAGE_TIMERS)
}

input IntegrationOAuthCodeInput {
	code: String!
	state: String!
}

enum ImportFailureReason {
	DUPLICATE
	PLAN_LIMIT
	UNSUPPORTED_ROLE
	UNSUPPORTED_RESPONSE_TYPE
	INCOMPATIBLE_INTERVALS
	INVALID_RECORD
}

type ImportFailure {
	name: String!
	reason: ImportFailureReason!
}

type ImportReport {
	importedCount: Int!
	failedCount: Int!
	failures: [ImportFailure!]!
}

type NightbotIntegration {
	userName: String!
	avatar: String!
}

type StreamElementsIntegration {
	userName: String!
	avatar: String!
}
