services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=3600"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=45.145.41.202"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=45.145.41.202"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    networks:
      - traefik-public
      - cloudflared
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 30
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        # Traefik dashboard (internal)
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.twir.app`)"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.entrypoints=web"
        # Dummy service required for Swarm mode
        - "traefik.http.services.traefik-noop.loadbalancer.server.port=80"
        # Global gzip compression middleware
        - "traefik.http.middlewares.gzip.compress=true"
        # Rate limiting: 1000 req/10s per IP (uses X-Forwarded-For depth=1, covering Cloudflare)
        - "traefik.http.middlewares.rate-limit.ratelimit.average=1000"
        - "traefik.http.middlewares.rate-limit.ratelimit.period=10s"
        - "traefik.http.middlewares.rate-limit.ratelimit.burst=1000"
        - "traefik.http.middlewares.rate-limit.ratelimit.sourcecriterion.ipstrategy.depth=1"

  adminer:
    image: adminer
    networks:
      - twir
      - cloudflared
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.hostname == traefik-1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-adminer.rule=Host(`adminer.twir.app`)"
        - "traefik.http.routers.twir-adminer.entrypoints=web"
        - "traefik.http.routers.twir-adminer.service=twir-adminer"
        - "traefik.http.services.twir-adminer.loadbalancer.server.port=8080"

  dbx:
    image: t8y2/dbx:latest
    ports:
      - "4224:4224"
    volumes:
      - dbx-data:/app/data
    networks:
      - twir
      - cloudflared
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.labels.databases != true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-dbx.rule=Host(`dbx.twir.app`)"
        - "traefik.http.routers.twir-dbx.entrypoints=web"
        - "traefik.http.routers.twir-dbx.service=twir-dbx"
        - "traefik.http.services.twir-dbx.loadbalancer.server.port=4224"

  nats:
    image: nats:2.10.11-scratch
    restart: always
    command: -js -m 8222
    networks:
      - twir
      - cloudflared
      - traefik-public
    deploy:
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-nats.rule=Host(`nats.twir.app`)"
        - "traefik.http.routers.twir-nats.entrypoints=web"
        - "traefik.http.routers.twir-nats.service=twir-nats"
        - "traefik.http.services.twir-nats.loadbalancer.server.port=8222"

  uptrace:
    image: uptrace/uptrace:2.1.0-beta.5
    entrypoint: ["/bin/sh", "/etc/uptrace/entrypoint.sh"]
    configs:
      - source: uptrace_config
        target: /etc/uptrace/config.yml.tmpl
      - source: uptrace_entrypoint
        target: /etc/uptrace/entrypoint.sh
    secrets:
      - uptrace_dsn
      - uptrace_service_secret
      - uptrace_admin_password
      - uptrace_clickhouse_password
      - uptrace_postgres_password
    networks:
      - twir
      - traefik-public
      - cloudflared
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 30
      placement:
        constraints:
          - node.labels.databases != true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-uptrace.rule=Host(`uptrace.twir.app`)"
        - "traefik.http.routers.twir-uptrace.entrypoints=web"
        - "traefik.http.routers.twir-uptrace.service=twir-uptrace"
        - "traefik.http.routers.twir-uptrace.middlewares=gzip,rate-limit"
        - "traefik.http.services.twir-uptrace.loadbalancer.server.port=80"

  grafana:
    image: grafana/grafana:12.0.0
    entrypoint: ["/bin/sh", "/etc/grafana/entrypoint.sh"]
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.20.0
    configs:
      - source: uptrace_grafana_datasource_v2
        target: /etc/grafana/provisioning/datasources/uptrace.yml
      - source: uptrace_grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/twir.yml
      - source: uptrace_grafana_dashboard_twir_overview_v12
        target: /etc/grafana/dashboards/twir-overview.json
      - source: uptrace_grafana_config
        target: /etc/grafana/grafana.ini
      - source: uptrace_grafana_entrypoint_v2
        target: /etc/grafana/entrypoint.sh
    secrets:
      - grafana_admin_password
      - uptrace_grafana_token
      - grafana_postgres_password
      - source: grafana_uptrace_clickhouse_password_v2
        target: grafana_uptrace_clickhouse_password
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - twir
      - traefik-public
      - cloudflared
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      placement:
        constraints:
          - node.labels.databases != true
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-grafana.rule=Host(`grafana.twir.app`)"
        - "traefik.http.routers.twir-grafana.entrypoints=web"
        - "traefik.http.routers.twir-grafana.service=twir-grafana"
        - "traefik.http.routers.twir-grafana.middlewares=gzip,rate-limit"
        - "traefik.http.services.twir-grafana.loadbalancer.server.port=3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: uptrace_otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
    secrets:
      - uptrace_dsn
    networks:
      - twir
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    hostname: "{{.Node.Hostname}}"
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)"
    pid: host
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    networks:
      - twir
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      resources:
        limits:
          memory: 128M

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    hostname: "{{.Node.Hostname}}"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
    privileged: true
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
    networks:
      - twir
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:18.1
    command: postgres -c max_connections=1000 -c shared_buffers=2GB -c effective_cache_size=6GB -c maintenance_work_mem=512MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=32MB -c huge_pages=off -c min_wal_size=1GB -c max_wal_size=4GB -c shared_preload_libraries='pg_stat_statements'
    environment:
      POSTGRES_USER_FILE: /run/secrets/twir_postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/twir_postgres_password
      POSTGRES_DB_FILE: /run/secrets/twir_postgres_db
    secrets:
      - twir_postgres_user
      - twir_postgres_password
      - twir_postgres_db
    volumes:
      - pg-data:/var/lib/postgresql
    networks:
      - twir
    deploy:
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases-1 == true

  postgres-backup:
    image: registry.twir.app/twirapp/postgres-backup:latest
    secrets:
      - twir_doppler_token
    networks:
      - twir
    deploy:
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases == true

  pgdog:
    image: ghcr.io/pgdogdev/pgdog:v0.1.50
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "cp /pgdog/start.sh /tmp/start.sh && chmod +x /tmp/start.sh && exec /tmp/start.sh",
      ]
    secrets:
      - twir_postgres_db
      - twir_postgres_password
      - twir_postgres_user
    configs:
      - source: pgdog_start_script
        target: /pgdog/start.sh
      - source: pgdog_config
        target: /pgdog/pgdog.toml
      - source: pgdog_users_config
        target: /pgdog/users_base.toml
    networks:
      - twir
    deploy:
      update_config:
        parallelism: 1
        order: stop-first
      mode: replicated
      replicas: 3
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr

  clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    networks:
      - twir
      - cloudflared
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    configs:
      - source: clickhouse_config
        target: /etc/clickhouse-server/config.d/override.xml
    environment:
      - CLICKHOUSE_USER=twir
      - CLICKHOUSE_PASSWORD=twir
      - CLICKHOUSE_DB=twir
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
      restart_policy:
        condition: on-failure
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases-1 == true
    ulimits:
      nofile: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK

  uptrace-clickhouse:
    image: clickhouse/clickhouse-server:26.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export CLICKHOUSE_PASSWORD="$$(tr -d ''\r\n'' < /run/secrets/uptrace_clickhouse_password)"; exec /entrypoint.sh'
    environment:
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_DB: uptrace
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    secrets:
      - uptrace_clickhouse_password
    configs:
      - source: uptrace_clickhouse_listen_config
        target: /etc/clickhouse-server/config.d/00-listen.xml
      - source: uptrace_clickhouse_optimization_config
        target: /etc/clickhouse-server/config.d/90-disable-system-logs.xml
    volumes:
      - uptrace-clickhouse-data:/var/lib/clickhouse
    networks:
      - twir
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ulimits:
      nofile: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases == true
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  uptrace-postgres:
    image: postgres:17-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: uptrace
      POSTGRES_PASSWORD_FILE: /run/secrets/uptrace_postgres_password
      POSTGRES_DB: uptrace
    secrets:
      - uptrace_postgres_password
    volumes:
      - uptrace-postgres-data:/var/lib/postgresql/data
    networks:
      - twir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptrace -d uptrace"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases == true

  uptrace-redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --loglevel warning
    networks:
      - twir
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases == true

  uptrace-clickhouse-ttl:
    image: clickhouse/clickhouse-server:26.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        password="$$(tr -d '\r\n' < /run/secrets/uptrace_clickhouse_password)"
        attempt=1
        until [ "$$(clickhouse-client --host uptrace-clickhouse --user uptrace --password "$$password" --database uptrace --query 'EXISTS TABLE spans_index' 2>/dev/null)" = "1" ]; do
          if [ "$$attempt" -ge 60 ]; then
            echo "Uptrace schema was not ready after $$attempt attempts" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 5
        done
        exec clickhouse-client --host uptrace-clickhouse --user uptrace --password "$$password" --database uptrace --multiquery < /etc/uptrace/apply-ttl.sql
    secrets:
      - uptrace_clickhouse_password
    configs:
      - source: uptrace_clickhouse_ttl
        target: /etc/uptrace/apply-ttl.sql
    networks:
      - twir
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
      placement:
        constraints:
          - node.labels.databases == true

  temporal-postgres:
    image: "bitnamilegacy/postgresql:17"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
      POSTGRESQL_POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/bitnami/postgresql
    networks:
      - twir
    deploy:
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases-1 == true

  temporal:
    depends_on:
      - postgres
    image: twirapp/temporal:latest
    networks:
      - twir
    secrets:
      - twir_postgres_user
      - twir_postgres_password
    deploy:
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      labels:
        kompose.volume.type: configMap
      placement:
        constraints:
          - node.labels.databases != true

  temporal-ui:
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.21.0
    networks:
      - twir
      - cloudflared
      - traefik-public
    deploy:
      placement:
        constraints:
          - node.labels.databases != true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-temporal.rule=Host(`temporal.twir.app`)"
        - "traefik.http.routers.twir-temporal.entrypoints=web"
        - "traefik.http.routers.twir-temporal.service=twir-temporal"
        - "traefik.http.services.twir-temporal.loadbalancer.server.port=8080"

  migrations:
    image: registry.twir.app/twirapp/migrations:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    networks:
      - twir
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 30
    healthcheck:
      test: exit 0

  redis:
    image: redis:8.0.2
    command: redis-server --save 60 1 --loglevel warning --io-threads 4
    volumes:
      - redis-data:/data
    networks:
      - twir
    deploy:
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases == true

  api-gql:
    image: registry.twir.app/twirapp/api-gql:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
      - traefik-public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"

        # Shared service definition
        - "traefik.http.services.twir-api-gql.loadbalancer.server.port=3009"

        # /api route for twir.app
        - "traefik.http.routers.twir-api.rule=Host(`twir.app`) && PathPrefix(`/api`)"
        - "traefik.http.routers.twir-api.entrypoints=web"
        - "traefik.http.routers.twir-api.service=twir-api-gql"
        - "traefik.http.routers.twir-api.middlewares=api-stripprefix,gzip,rate-limit"
        - "traefik.http.routers.twir-api.priority=20"
        - "traefik.http.middlewares.api-stripprefix.stripprefix.prefixes=/api"

        # MCP OAuth discovery for twir.app (api-gql serves root .well-known paths)
        - "traefik.http.routers.twir-oauth-discovery.rule=Host(`twir.app`) && (PathPrefix(`/.well-known/oauth`) || Path(`/.well-known/openid-configuration`))"
        - "traefik.http.routers.twir-oauth-discovery.entrypoints=web"
        - "traefik.http.routers.twir-oauth-discovery.service=twir-api-gql"
        - "traefik.http.routers.twir-oauth-discovery.middlewares=gzip,rate-limit"
        - "traefik.http.routers.twir-oauth-discovery.priority=20"

        # /s shortener route for twir.app
        - "traefik.http.routers.twir-shortener.rule=Host(`twir.app`) && PathPrefix(`/s/`)"
        - "traefik.http.routers.twir-shortener.entrypoints=web"
        - "traefik.http.routers.twir-shortener.service=twir-api-gql"
        - "traefik.http.routers.twir-shortener.middlewares=shortener-rewrite,gzip,rate-limit"
        - "traefik.http.routers.twir-shortener.priority=20"
        - "traefik.http.middlewares.shortener-rewrite.replacepathregex.regex=^/s/(.*)"
        - "traefik.http.middlewares.shortener-rewrite.replacepathregex.replacement=/v1/short-links/$${1}"

        # /api route for cf.twir.app
        - "traefik.http.routers.cf-api.rule=Host(`cf.twir.app`) && PathPrefix(`/api`)"
        - "traefik.http.routers.cf-api.entrypoints=web"
        - "traefik.http.routers.cf-api.service=twir-api-gql"
        - "traefik.http.routers.cf-api.middlewares=api-stripprefix,gzip,rate-limit"
        - "traefik.http.routers.cf-api.priority=20"

        # /s shortener route for cf.twir.app
        - "traefik.http.routers.cf-shortener.rule=Host(`cf.twir.app`) && PathPrefix(`/s/`)"
        - "traefik.http.routers.cf-shortener.entrypoints=web"
        - "traefik.http.routers.cf-shortener.service=twir-api-gql"
        - "traefik.http.routers.cf-shortener.middlewares=shortener-rewrite,gzip,rate-limit"
        - "traefik.http.routers.cf-shortener.priority=20"

        # Catch-all: any unmatched host → /v1/short-links{path} (lowest priority)
        - "traefik.http.routers.twir-custom-domain.rule=HostRegexp(`.+`)"
        - "traefik.http.routers.twir-custom-domain.entrypoints=web"
        - "traefik.http.routers.twir-custom-domain.service=twir-api-gql"
        - "traefik.http.routers.twir-custom-domain.middlewares=custom-domain-rewrite,gzip,rate-limit"
        - "traefik.http.routers.twir-custom-domain.priority=1"
        - "traefik.http.middlewares.custom-domain-rewrite.replacepathregex.regex=^(.*)"
        - "traefik.http.middlewares.custom-domain-rewrite.replacepathregex.replacement=/v1/short-links$${1}"

      update_config:
        parallelism: 2
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
      endpoint_mode: dnsrr
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.databases != true

  bots:
    image: registry.twir.app/twirapp/bots:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - traefik-public
      - twir
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-bots.rule=Host(`services-bots.twir.app`)"
        - "traefik.http.routers.twir-bots.entrypoints=web"
        - "traefik.http.routers.twir-bots.service=twir-bots"
        - "traefik.http.routers.twir-bots.middlewares=gzip,rate-limit"
        - "traefik.http.services.twir-bots.loadbalancer.server.port=3000"
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      replicas: 4
      mode: replicated
      update_config:
        parallelism: 2
        order: start-first
      placement:
        constraints:
          - node.labels.databases != true

  parser:
    image: registry.twir.app/twirapp/parser:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    deploy:
      update_config:
        parallelism: 2
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      mode: replicated
      replicas: 6
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true
    networks:
      - twir

  timers:
    image: registry.twir.app/twirapp/timers:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true
      resources:
        limits:
          cpus: "1.0"

  scheduler:
    image: registry.twir.app/twirapp/scheduler:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true
      resources:
        limits:
          cpus: "1.0"

  eventsub:
    image: registry.twir.app/twirapp/eventsub:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    networks:
      - twir
      - traefik-public
      - cloudflared
    environment:
      REPLICA: "{{.Task.Slot}}"
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      placement:
        constraints:
          - node.labels.databases != true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.twir-eventsub.rule=Host(`eventsub.twir.app`)"
        - "traefik.http.routers.twir-eventsub.entrypoints=web"
        - "traefik.http.routers.twir-eventsub.service=twir-eventsub"
        - "traefik.http.routers.twir-eventsub.middlewares=gzip,rate-limit"
        - "traefik.http.services.twir-eventsub.loadbalancer.server.port=3030"

  integrations:
    image: registry.twir.app/twirapp/integrations:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    networks:
      - twir
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr

  executron:
    image: registry.twir.app/twirapp/executron:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    networks:
      - twir
    security_opt:
      - no-new-privileges:true
    deploy:
      mode: replicated
      replicas: 3
      update_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  ytsub:
    image: registry.twir.app/twirapp/ytsub:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    networks:
      - twir
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true

  warp-proxy:
    image: ghcr.io/mon-ius/docker-warp-socks
    cap_add:
      - ALL
    networks:
      - twir
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-x",
          "socks5h://127.0.0.1:9091",
          "-fsSL",
          "https://www.cloudflare.com/cdn-cgi/trace",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      mode: global
      update_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr

  web:
    image: registry.twir.app/twirapp/web:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    networks:
      - twir
      - traefik-public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        # twir.app catch-all (lower priority than path-specific routes)
        - "traefik.http.routers.twir-web.rule=Host(`twir.app`)"
        - "traefik.http.routers.twir-web.entrypoints=web"
        - "traefik.http.routers.twir-web.service=twir-web"
        - "traefik.http.routers.twir-web.middlewares=gzip,rate-limit"
        - "traefik.http.routers.twir-web.priority=10"
        # cf.twir.app catch-all
        - "traefik.http.routers.cf-web.rule=Host(`cf.twir.app`)"
        - "traefik.http.routers.cf-web.entrypoints=web"
        - "traefik.http.routers.cf-web.service=twir-web"
        - "traefik.http.routers.cf-web.middlewares=gzip,rate-limit"
        - "traefik.http.routers.cf-web.priority=10"
        - "traefik.http.services.twir-web.loadbalancer.server.port=3000"
      update_config:
        order: start-first
        parallelism: 2
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      resources:
        limits:
          cpus: "0.5"
          memory: 1500M
      mode: replicated
      replicas: 4
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true

  overlays:
    image: registry.twir.app/twirapp/overlays:${TWIR_IMAGE_TAG:-latest}
    command: --gzip --brotli --threshold 500
    networks:
      - twir
      - traefik-public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        # twir.app/overlays
        - "traefik.http.routers.twir-overlays.rule=Host(`twir.app`) && PathPrefix(`/overlays`)"
        - "traefik.http.routers.twir-overlays.entrypoints=web"
        - "traefik.http.routers.twir-overlays.service=twir-overlays"
        - "traefik.http.routers.twir-overlays.middlewares=overlays-stripprefix,gzip,rate-limit"
        - "traefik.http.routers.twir-overlays.priority=20"
        - "traefik.http.middlewares.overlays-stripprefix.stripprefix.prefixes=/overlays"
        # cf.twir.app/overlays
        - "traefik.http.routers.cf-overlays.rule=Host(`cf.twir.app`) && PathPrefix(`/overlays`)"
        - "traefik.http.routers.cf-overlays.entrypoints=web"
        - "traefik.http.routers.cf-overlays.service=twir-overlays"
        - "traefik.http.routers.cf-overlays.middlewares=overlays-stripprefix,gzip,rate-limit"
        - "traefik.http.routers.cf-overlays.priority=20"
        - "traefik.http.services.twir-overlays.loadbalancer.server.port=8080"
      update_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true

  websockets:
    image: registry.twir.app/twirapp/websockets:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
      - traefik-public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        # twir.app/socket (WebSocket — no gzip)
        - "traefik.http.routers.twir-websockets.rule=Host(`twir.app`) && PathPrefix(`/socket`)"
        - "traefik.http.routers.twir-websockets.entrypoints=web"
        - "traefik.http.routers.twir-websockets.service=twir-websockets"
        - "traefik.http.routers.twir-websockets.middlewares=socket-stripprefix,rate-limit"
        - "traefik.http.routers.twir-websockets.priority=20"
        - "traefik.http.middlewares.socket-stripprefix.stripprefix.prefixes=/socket"
        # cf.twir.app/socket
        - "traefik.http.routers.cf-websockets.rule=Host(`cf.twir.app`) && PathPrefix(`/socket`)"
        - "traefik.http.routers.cf-websockets.entrypoints=web"
        - "traefik.http.routers.cf-websockets.service=twir-websockets"
        - "traefik.http.routers.cf-websockets.middlewares=socket-stripprefix,rate-limit"
        - "traefik.http.routers.cf-websockets.priority=20"
        - "traefik.http.services.twir-websockets.loadbalancer.server.port=3004"
      resources:
        limits:
          cpus: "1"
          memory: 200M
      update_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true

  tokens:
    image: registry.twir.app/twirapp/tokens:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
    deploy:
      update_config:
        parallelism: 2
        order: start-first
      mode: replicated
      replicas: 4
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true

  emotes-cacher:
    image: registry.twir.app/twirapp/emotes-cacher:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
    deploy:
      update_config:
        parallelism: 2
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.databases != true
      resources:
        limits:
          cpus: "1.0"

  events:
    image: registry.twir.app/twirapp/events:${TWIR_IMAGE_TAG:-latest}
    secrets:
      - twir_doppler_token
    environment:
      REPLICA: "{{.Task.Slot}}"
    networks:
      - twir
    deploy:
      update_config:
        parallelism: 2
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      mode: replicated
      replicas: 6
      placement:
        constraints:
          - node.labels.databases != true

  tts:
    image: aculeasis/rhvoice-rest:latest
    networks:
      - twir
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512MB
      update_config:
        parallelism: 2
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      endpoint_mode: dnsrr
      mode: replicated
      replicas: 4
      placement:
        constraints:
          - node.labels.databases != true

  language-processor:
    image: twirapp/language-processor-py:latest
    secrets:
      - twir_doppler_token
    environment:
      - APP_ENV=production
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
      update_config:
        parallelism: 2
        order: start-first
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      placement:
        constraints:
          - node.labels.databases != true
          - node.role != manager
    networks:
      - cloudflared
      - twir

  toxicity-detector:
    image: registry.twir.app/twirapp/toxicity-detector:latest
    environment:
      TOXICITY_THRESHOLD: -4
    deploy:
      update_config:
        parallelism: 2
        order: start-first
      mode: replicated
      replicas: 4
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      placement:
        constraints:
          - node.labels.databases != true
          - node.role != manager
    networks:
      - twir

  # This is https://github.com/twirapp/music-recognizer repository, which is doing "Shazam for twitch stream".
  music-recognizer:
    image: registry.twir.app/twirapp/music-recognizer:latest
    secrets:
      - twir_doppler_token
    networks:
      - twir
      - traefik-public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik-public"
        - "traefik.http.routers.music-recognizer.rule=Host(`music-recognizer.twir.app`)"
        - "traefik.http.routers.music-recognizer.entrypoints=web"
        - "traefik.http.routers.music-recognizer.service=music-recognizer"
        - "traefik.http.routers.music-recognizer.middlewares=gzip,rate-limit"
        - "traefik.http.services.music-recognizer.loadbalancer.server.port=3000"
      update_config:
        parallelism: 2
        order: start-first
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 30
      mode: replicated
      replicas: 4
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.databases != true

  deploy-webhook:
    image: registry.twir.app/twirapp/deploy-receiver:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'TWIR_DEPLOY_WEBHOOK_TOKEN="$$(cat /run/secrets/twir_deploy_webhook_token)" exec /app/twir-cli deploy-webhook'
    environment:
      TWIR_DEPLOY_RECEIVER_ADDR: :8090
      TWIR_DEPLOY_STACK_NAME: twir
      TWIR_DEPLOY_REGISTRY: registry.twir.app
    secrets:
      - twir_deploy_webhook_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - twir
    ports:
      - target: 8090
        published: 8090
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 30
      placement:
        constraints:
          - node.role == manager

configs:
  clickhouse_config:
    file: ./configs/clickhouse-config.xml

  uptrace_config:
    file: ./configs/uptrace/uptrace.yml
  uptrace_entrypoint:
    file: ./configs/uptrace/entrypoint.sh
  uptrace_otel_collector_config:
    file: ./configs/uptrace/otel-collector.yml
  uptrace_clickhouse_listen_config:
    file: ./configs/uptrace/clickhouse/00-listen.xml
  uptrace_clickhouse_optimization_config:
    file: ./configs/uptrace/clickhouse/90-disable-system-logs.xml
  uptrace_clickhouse_ttl:
    file: ./configs/uptrace/apply-ttl.sql
  uptrace_grafana_datasource_v2:
    file: ./configs/uptrace/grafana/datasource.yml
  uptrace_grafana_dashboard_provider:
    file: ./configs/uptrace/grafana/dashboard-provider.yml
  uptrace_grafana_dashboard_twir_overview_v12:
    file: ./configs/uptrace/grafana/dashboards/twir-overview.json
  uptrace_grafana_config:
    file: ./configs/uptrace/grafana/grafana.ini
  uptrace_grafana_entrypoint_v2:
    file: ./configs/uptrace/grafana/entrypoint.sh

  pgdog_users_config:
    file: ./configs/pgdog/users.toml
  pgdog_config:
    file: ./configs/pgdog/pgdog.prod.toml
  pgdog_start_script:
    file: ./configs/pgdog/start.sh

volumes:
  pg-data:
  redis-data:
  minio-data:
  temporal-postgres-data:
  clickhouse-data:
  uptrace-clickhouse-data:
  uptrace-postgres-data:
  grafana-data:
  dbx-data:

networks:
  twir:
    name: twir
    external: true
  traefik-public:
    external: true
  cloudflared:
    external: true

secrets:
  twir_doppler_token:
    external: true
  twir_postgres_user:
    external: true
  twir_postgres_db:
    external: true
  twir_postgres_password:
    external: true
  twir_deploy_webhook_token:
    external: true
  uptrace_dsn:
    external: true
  uptrace_service_secret:
    external: true
  uptrace_admin_password:
    external: true
  uptrace_clickhouse_password:
    external: true
  uptrace_postgres_password:
    external: true
  grafana_admin_password:
    external: true
  uptrace_grafana_token:
    external: true
  grafana_postgres_password:
    external: true
  grafana_uptrace_clickhouse_password_v2:
    external: true
