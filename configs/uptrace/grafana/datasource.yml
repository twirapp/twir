apiVersion: 1

prune: true

datasources:
  - name: Uptrace Tempo
    uid: uptrace-tempo
    type: tempo
    access: proxy
    url: http://uptrace/api/tempo/1
    editable: false
    jsonData:
      httpHeaderName1: Authorization
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: uptrace-prometheus
    secureJsonData:
      httpHeaderValue1: Bearer ${UPTRACE_GRAFANA_TOKEN}

  - name: Uptrace Prometheus
    uid: uptrace-prometheus
    type: prometheus
    access: proxy
    url: http://uptrace/api/prometheus/1
    editable: false
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      httpMethod: POST
    secureJsonData:
      httpHeaderValue1: Bearer ${UPTRACE_GRAFANA_TOKEN}

  - name: Twir PostgreSQL
    uid: twir-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_ro
    editable: false
    jsonData:
      database: twir
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 5
      maxIdleConns: 2
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_POSTGRES_PASSWORD}

  - name: Uptrace ClickHouse
    uid: uptrace-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      defaultDatabase: uptrace
      host: uptrace-clickhouse
      port: 9000
      protocol: native
      username: grafana_ro
      secure: false
      dialTimeout: 5
      queryTimeout: 30
    secureJsonData:
      password: ${GRAFANA_UPTRACE_CLICKHOUSE_PASSWORD}
